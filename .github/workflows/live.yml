# Live airliners over India for the website's /live page: every 5 minutes one OpenSky request
# (OpenSky does not answer the Cloudflare Worker), published as ONE commit on the `live-data`
# branch, replaced each time. Callsigns only, no aircraft addresses. Optional secrets
# OPENSKY_CLIENT_ID / OPENSKY_CLIENT_SECRET (the team's OpenSky API client) raise the limits.
name: live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live_snapshot.py
          sparse-checkout-cone-mode: false

      - name: Fetch live airliners over India
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          python3 scripts/live_snapshot.py "$RUNNER_TEMP/live/india.json"

      - name: Publish to the live-data branch (one commit, replaced each time)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/live"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live snapshot $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" live-data
