# Live airliners over India for the website's /live page: one OpenSky request every 2.5 minutes
# (OpenSky does not answer the Cloudflare Worker), published as ONE commit on the `live-data`
# branch, replaced each time. Callsigns only, no aircraft addresses. Secrets OPENSKY_CLIENT_ID /
# OPENSKY_CLIENT_SECRET (the team's OpenSky API client) raise the limits.
# GitHub starts scheduled runs hours late, so the website's Worker also starts this workflow
# (workflow_dispatch) when a visitor finds the snapshot older than 6 min. Each run takes 6
# snapshots over about 13 minutes. At most ~2,300 OpenSky credits a day (limit 4,000).
name: live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live_snapshot.py
          sparse-checkout-cone-mode: false

      - name: Fetch and publish every 2.5 minutes (6 times)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          cp scripts/live_snapshot.py "$RUNNER_TEMP/snap.py"
          cd "$RUNNER_TEMP/live"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            if python3 "$RUNNER_TEMP/snap.py" india.json; then
              git add -A
              git commit -q --amend --allow-empty -m "Live snapshot $(date -u +%FT%TZ)" 2>/dev/null || git commit -q -m "Live snapshot $(date -u +%FT%TZ)"
              git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" live-data
            fi
            if [ "$i" -lt 6 ]; then sleep 150; fi
          done
