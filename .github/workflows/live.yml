# Live airliners over India for the website's /live page: one OpenSky request every 2.5 minutes
# (OpenSky does not answer the Cloudflare Worker), published as ONE commit on the `live-data`
# branch, replaced each time. Callsigns only, no aircraft addresses. Secrets OPENSKY_CLIENT_ID /
# OPENSKY_CLIENT_SECRET (the team's OpenSky API client) raise the limits.
# GitHub starts scheduled runs hours late, so the website's Worker also starts this workflow
# (workflow_dispatch) when a visitor finds the snapshot older than 6 min. Each run takes 6
# snapshots over about 13 minutes. At most ~2,300 OpenSky credits a day (limit 4,000).
name: live

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/live_snapshot.py
            scripts/flightinfo.py
          sparse-checkout-cone-mode: false

      - name: Fetch and publish every 2.5 minutes (6 times)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/live"
          cp scripts/live_snapshot.py "$RUNNER_TEMP/snap.py"
          cp scripts/flightinfo.py "$RUNNER_TEMP/flightinfo.py"
          # aircraft types by address (Mictronics database via tar1090-db) and a route cache shared by the 6 snapshots
          export TYPES_DB="$RUNNER_TEMP/aircraft.csv.gz" ROUTE_CACHE="$RUNNER_TEMP/routes.json"
          curl -fsSL -o "$TYPES_DB" https://github.com/wiedehopf/tar1090-db/raw/refs/heads/csv/aircraft.csv.gz || rm -f "$TYPES_DB"
          cd "$RUNNER_TEMP/live"
          # the last snapshot with a full sky (>= 150 airliners) is kept as india-good.json: the
          # website shows it, labelled as recorded, when the live feed is down
          curl -fsSL -o india-good.json "https://raw.githubusercontent.com/${{ github.repository }}/live-data/india-good.json" || rm -f india-good.json
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            if python3 "$RUNNER_TEMP/snap.py" india.json; then
              [ "$(jq '.ac | length' india.json)" -ge 150 ] && cp india.json india-good.json
              git add -A
              git commit -q --amend --allow-empty -m "Live snapshot $(date -u +%FT%TZ)" 2>/dev/null || git commit -q -m "Live snapshot $(date -u +%FT%TZ)"
              git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" live-data
            fi
            if [ "$i" -lt 6 ]; then sleep 150; fi
          done
