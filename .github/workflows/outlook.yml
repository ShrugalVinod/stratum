# Live contrail outlook (experimental): every morning, the latest 00 UTC ECMWF open-data forecast
# (CC BY 4.0) becomes a small web build (today + tomorrow, physics only) with NOTAM-style
# advisories. Published as one commit per build on the `outlook-data` branch (its own history,
# ~1 MB a day, so the report card can find any recent day's forecast; main does not grow); the
# website's Worker serves the latest at /data/outlook/.
name: outlook

on:
  schedule:
    - cron: "20 9 * * *" # 09:20 UTC: the 00 UTC run's open data are out by about 08:00 UTC
    - cron: "50 13 * * *" # backup: GitHub sometimes skips a scheduled run (the job skips itself if today's is built)
  # the website's Worker also starts this workflow when a visitor finds yesterday's forecast
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: true

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Already built today?
        id: fresh
        run: |
          run=$(curl -fsS "https://raw.githubusercontent.com/${{ github.repository }}/outlook-data/outlook.json" | jq -r .run || echo none)
          if [ "${run:0:10}" = "$(date -u +%F)" ]; then echo "today's outlook ($run) is published"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.skip != '1'

      - uses: astral-sh/setup-uv@v6
        if: steps.fresh.outputs.skip != '1'
        with:
          enable-cache: true

      - name: Install pinned environment
        if: steps.fresh.outputs.skip != '1'
        run: uv sync --frozen --python 3.12 --no-dev

      - name: Build the outlook
        if: steps.fresh.outputs.skip != '1'
        run: uv run --no-sync stratum outlook --out "$RUNNER_TEMP/outlook"

      - name: Publish to the outlook-data branch (one commit per build; history kept for the report card)
        if: steps.fresh.outputs.skip != '1'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          cd "$RUNNER_TEMP"
          # earlier builds stay in the branch history (~1 MB a day), so the daily report card can
          # find the forecast that covered a day even when it runs after the next build
          if git clone -q --filter=blob:none --branch outlook-data "$repo" hist 2>/dev/null; then
            cd hist && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git init -q -b outlook-data hist && cd hist
          fi
          cp -R "$RUNNER_TEMP/outlook/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Outlook $(jq -r .run outlook.json)"
          git push -q "$repo" HEAD:outlook-data
