# Study domain and development corridor.
# The core values (bbox, FL250 floor) are pre-registered in preregistered.yaml (paper §3.1);
# this file adds engineering geometry derived from them. Build prompt §3.1, §3.2.

study_bbox:            # paper §3.1: 6–37°N, 68–98°E
  lat: [6.0, 37.0]
  lon: [68.0, 98.0]

# ERA5 / satellite downloads are 2° larger on every side because contrails drift
# (build prompt §3.2): 4–39°N, 66–100°E.
padding_deg: 2.0
padded_bbox:
  lat: [4.0, 39.0]
  lon: [66.0, 100.0]

# Cruise floor: FL250 ≈ 376 hPa in the ISA (paper §3.1).
flight_levels:
  min_cruise_fl: 250
  ingest_min_fl: 200          # keep a little below FL250 so climbs survive (build prompt §1.2)
  dashboard_fl_range: [280, 420]
  dashboard_fl_step: 20

# Development corridor: a polygon 75 km either side of the great circle VIDP–VABB
# (build prompt §3.1). The polygon is generated by stratum.config.corridor_polygon()
# and written to configs/corridor_DEL-BOM.geojson by `stratum write-corridor`.
corridor:
  name: DEL-BOM
  half_width_km: 75.0
  great_circle_points: 200     # vertices used to trace the great circle
  airports:
    VIDP:   # Indira Gandhi International, Delhi. Source: OurAirports airports.csv (retrieved 2026-10-13)
      lat: 28.55563
      lon: 77.09519
    VABB:   # Chhatrapati Shivaji Maharaj International, Mumbai. Same source.
      lat: 19.088699
      lon: 72.867897

# Meteosat-9 IODC sub-satellite longitude (build prompt §3.4); used for VZA and parallax.
satellite:
  name: Meteosat-9 IODC
  sub_satellite_lon: 45.5
