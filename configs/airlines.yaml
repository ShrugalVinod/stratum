# ICAO airline designators treated as commercial airlines (build prompt §3.6).
# Used ONLY to decide what may appear in public outputs (privacy). Not pre-registered.
#
# Built 2026-10-15 from every airline-pattern callsign seen on the 2026-01-01 ADS-B Exchange day
# (191 prefixes), cross-checked against the OpenSky aircraft database's operator name for the
# aircraft flying each prefix. Rule: scheduled, charter and cargo airlines are listed; VIP,
# government, military, private and business-jet operators are excluded; codes whose operator
# could not be confirmed are NOT listed (hidden by default: when unsure, do not publish).
# Compiled by Claude at the request of Shrugal Vinod (team lead), who delegated the review, 2026-10-15. Re-check when new data arrive:
# unlisted prefixes are counted in every run summary (step9_reasons).
