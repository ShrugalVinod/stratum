<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="STRATUM — a student research project on persistent aircraft contrails over India: physics predictions, satellite evidence and honest decisions." />
    <meta name="theme-color" content="#05080E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>STRATUM — Move the plane. Lose the cloud.</title>
    <script>
      document.documentElement.classList.add("js");
      // Night is the default; the paper chart is the visitor's choice (header toggle)
      try { if (localStorage.getItem("stratum-theme") === "light") { document.documentElement.dataset.theme = "light"; document.querySelector('meta[name="theme-color"]').content = "#F1ECE1"; } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
